name: Observability Gate (demo)

on:
  pull_request:
    paths:
      - 'fixtures/demo-**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Observability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install semgrep

      - name: Collect changed files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          FILES=$(git diff --name-only --diff-filter=ACMR \
                  origin/${{ github.base_ref }}...HEAD \
                  -- 'fixtures/demo-go/**' 'fixtures/demo-python/**' \
                  | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Scan changed files
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          mkdir -p out
          semgrep --config rules/ \
                  --json \
                  --output out/results.json \
                  --quiet \
                  ${{ steps.changed.outputs.files }}

      - name: Build report
        if: steps.changed.outputs.files != ''
        run: python3 scripts/report.py out/results.json

      - name: Comment on pull request
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload scan results
        if: steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: out/results.json

      - name: Gate
        if: steps.changed.outputs.files != ''
        run: |
          semgrep --config rules/ \
                  --severity ERROR \
                  --error \
                  --quiet \
                  ${{ steps.changed.outputs.files }}